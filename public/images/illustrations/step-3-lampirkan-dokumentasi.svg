<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>

    <!-- Water Flood Gradient -->
    <linearGradient id="waterGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Soft Shadow -->
    <filter id="shadow3" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F2A52" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Circle -->
  <circle cx="200" cy="150" r="125" fill="url(#bgGrad3)"/>
  <circle cx="65" cy="90" r="12" fill="#BAE6FD" opacity="0.6"/>
  <circle cx="340" cy="100" r="14" fill="#FED7AA" opacity="0.5"/>

  <!-- Top Floating Badge: "Bukti Otentik Lapangan" -->
  <g filter="url(#shadow3)" transform="translate(115, 18)">
    <rect width="170" height="30" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="16" cy="15" r="7" fill="#EFF6FF"/>
    <!-- Camera Icon -->
    <path d="M12 18 L20 18 C20.5 18 21 17.5 21 17 L21 13 C21 12.5 20.5 12 20 12 L18.5 12 L17.5 11 L14.5 11 L13.5 12 L12 12 C11.5 12 11 12.5 11 13 L11 17 C11 17.5 11.5 18 12 18 Z" fill="#173B70"/>
    <circle cx="16" cy="15" r="2" fill="#FFFFFF"/>
    <text x="28" y="15" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="700" fill="#173B70">FOTO ASLI LAPANGAN</text>
    <text x="28" y="24" font-family="'Poppins', sans-serif" font-size="6.5" font-weight="500" fill="#64748B">Dokumentasi Tanpa Rekayasa</text>
  </g>

  <!-- Central Camera Phone (Landscape Framing) -->
  <g filter="url(#shadow3)" transform="translate(60, 58)">
    <!-- Smartphone Chassis (Landscape 280 x 180) -->
    <rect width="280" height="180" rx="20" fill="#1E293B"/>
    <rect x="3" y="3" width="274" height="174" rx="17" fill="#0F172A"/>

    <!-- Screen Area (264 x 164) -->
    <rect x="8" y="8" width="264" height="164" rx="13" fill="#E2E8F0"/>

    <!-- CAMERA VIEWFINDER SCENE (Inside Screen) -->
    <g clip-path="url(#viewfinderClip)">
      <clipPath id="viewfinderClip">
        <rect x="8" y="8" width="264" height="164" rx="13"/>
      </clipPath>

      <!-- Sky Background in Scene -->
      <rect x="8" y="8" width="264" height="90" fill="#CBD5E1"/>

      <!-- Clouds -->
      <ellipse cx="60" cy="35" rx="35" ry="14" fill="#FFFFFF" opacity="0.8"/>
      <ellipse cx="180" cy="40" rx="45" ry="16" fill="#FFFFFF" opacity="0.8"/>
      <ellipse cx="230" cy="32" rx="30" ry="12" fill="#FFFFFF" opacity="0.8"/>

      <!-- Houses / Village Landscape in Distance -->
      <!-- House 1 -->
      <polygon points="40,75 65,55 90,75" fill="#B91C1C"/>
      <rect x="45" y="75" width="40" height="35" fill="#F8FAFC"/>
      <rect x="58" y="85" width="14" height="25" fill="#1E293B"/>

      <!-- House 2 (Submerged) -->
      <polygon points="120,70 150,48 180,70" fill="#D94350"/>
      <rect x="128" y="70" width="44" height="30" fill="#FFFFFF"/>
      <rect x="142" y="80" width="16" height="20" fill="#173B70"/>

      <!-- Trees -->
      <circle cx="108" cy="65" r="16" fill="#15803D"/>
      <rect x="105" y="75" width="6" height="20" fill="#78350F"/>
      <circle cx="205" cy="68" r="18" fill="#16A34A"/>
      <rect x="202" y="80" width="6" height="15" fill="#78350F"/>

      <!-- Flood Water Surface (Foreground Submerging Houses) -->
      <rect x="8" y="95" width="264" height="77" fill="url(#waterGrad3)"/>

      <!-- Water Ripples -->
      <path d="M20 110 C50 108 70 112 100 110 C130 108 160 112 200 110 C230 108 250 112 270 110" stroke="#E0F2FE" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M40 128 C80 126 110 130 150 128 C190 126 220 130 260 128" stroke="#E0F2FE" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M15 145 C60 143 90 147 130 145 C170 143 210 147 255 145" stroke="#BAE6FD" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Camera Viewfinder HUD Elements -->
      <!-- Rule of Thirds Grid -->
      <line x1="96" y1="8" x2="96" y2="172" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="3 3"/>
      <line x1="184" y1="8" x2="184" y2="172" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="3 3"/>
      <line x1="8" y1="62" x2="272" y2="62" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="3 3"/>
      <line x1="8" y1="118" x2="272" y2="118" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="3 3"/>

      <!-- 4 Viewfinder Focus Brackets (Yellow / White) -->
      <!-- Top Left -->
      <path d="M120 75 L112 75 L112 83" stroke="#FDE047" stroke-width="2" stroke-linecap="round"/>
      <!-- Top Right -->
      <path d="M160 75 L168 75 L168 83" stroke="#FDE047" stroke-width="2" stroke-linecap="round"/>
      <!-- Bottom Left -->
      <path d="M120 115 L112 115 L112 107" stroke="#FDE047" stroke-width="2" stroke-linecap="round"/>
      <!-- Bottom Right -->
      <path d="M160 115 L168 115 L168 107" stroke="#FDE047" stroke-width="2" stroke-linecap="round"/>

      <!-- Center Focus Point -->
      <circle cx="140" cy="95" r="3" fill="none" stroke="#FDE047" stroke-width="1.5"/>

      <!-- HUD Top Info Bar -->
      <rect x="8" y="8" width="264" height="20" fill="#000000" opacity="0.4"/>
      <circle cx="22" cy="18" r="3" fill="#DC2626"/>
      <text x="30" y="21" font-family="'Poppins', sans-serif" font-size="7" font-weight="700" fill="#FFFFFF">KAMERA AKTIF</text>
      <text x="255" y="21" font-family="'Poppins', sans-serif" font-size="7" font-weight="600" fill="#FFFFFF" text-anchor="end">4K • 60 FPS</text>

      <!-- HUD Bottom Bar with Shutter Button -->
      <rect x="8" y="146" width="264" height="26" fill="#000000" opacity="0.4"/>
      <!-- GPS Tag on Bottom HUD -->
      <text x="20" y="162" font-family="'Poppins', sans-serif" font-size="6.5" font-weight="600" fill="#FFFFFF">GPS AKTIF: -6.4921, 106.8124</text>

      <!-- Center Big Shutter Button -->
      <circle cx="140" cy="159" r="10" fill="#FFFFFF"/>
      <circle cx="140" cy="159" r="8" fill="#D94350"/>
      <circle cx="140" cy="159" r="3" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Left Hand Holding Camera Phone (Holding Edge) -->
  <path d="M35 150 C30 140 40 130 50 135 L62 138 L62 165 L50 168 C40 170 30 160 35 150 Z" fill="#F5D0C5" filter="url(#shadow3)"/>
  <rect x="15" y="142" width="25" height="18" rx="5" fill="#173B70"/>

  <!-- Right Hand Holding Camera Phone & Triggering Shutter -->
  <path d="M365 150 C370 140 360 130 350 135 L338 138 L338 165 L350 168 C360 170 370 160 365 150 Z" fill="#F5D0C5" filter="url(#shadow3)"/>
  <rect x="360" y="142" width="25" height="18" rx="5" fill="#173B70"/>

  <!-- Bottom Floating Geotag Badge -->
  <g filter="url(#shadow3)" transform="translate(100, 245)">
    <rect width="200" height="34" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="18" cy="17" r="8" fill="#ECFDF5"/>
    <path d="M14 17 L17 20 L22 14" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="15" font-family="'Poppins', sans-serif" font-size="8" font-weight="700" fill="#065F46">KOORDINAT LOKASI TERSIMPAN</text>
    <text x="34" y="25" font-family="'Poppins', sans-serif" font-size="7" font-weight="500" fill="#64748B">Memudahkan tim memvalidasi sebaran</text>
  </g>
</svg>

