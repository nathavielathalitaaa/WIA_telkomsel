<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F7FF"/>
      <stop offset="100%" stop-color="#E2EEFC"/>
    </linearGradient>

    <!-- Brand Button Gradient -->
    <linearGradient id="brandGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D94350"/>
      <stop offset="100%" stop-color="#173B70"/>
    </linearGradient>

    <!-- Phone Glass Gradient -->
    <linearGradient id="glassGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow1" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F2A52" flood-opacity="0.12"/>
    </filter>
    <filter id="cardShadow1" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#173B70" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Circle -->
  <circle cx="200" cy="150" r="125" fill="url(#bgGrad1)"/>
  <circle cx="290" cy="70" r="16" fill="#BAE6FD" opacity="0.6"/>
  <circle cx="95" cy="210" r="10" fill="#FED7AA" opacity="0.5"/>

  <!-- Background Decorative Tech Grid Lines -->
  <path d="M120 70 L280 70" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <path d="M100 230 L300 230" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Left Floating Badge: "Tanpa Akun" -->
  <g filter="url(#cardShadow1)" transform="translate(45, 90)">
    <rect width="112" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="18" cy="17" r="7" fill="#EFF6FF"/>
    <path d="M15 17 L17 19 L21 14" stroke="#173B70" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="16" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#173B70">BEBAS AKSES</text>
    <text x="32" y="26" font-family="'Poppins', sans-serif" font-size="8" font-weight="500" fill="#64748B">Tanpa Perlu Login</text>
  </g>

  <!-- Right Floating Badge: "Form Terbuka 24 Jam" -->
  <g filter="url(#cardShadow1)" transform="translate(248, 175)">
    <rect width="108" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="18" cy="17" r="7" fill="#FEF2F2"/>
    <circle cx="18" cy="17" r="2.5" fill="#D94350"/>
    <text x="32" y="16" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#202938">SIAP 24 JAM</text>
    <text x="32" y="26" font-family="'Poppins', sans-serif" font-size="8" font-weight="500" fill="#059669">Layanan Siaga</text>
  </g>

  <!-- Smartphone Shadow -->
  <rect x="135" y="32" width="130" height="236" rx="24" fill="#0F2A52" opacity="0.08" filter="url(#shadow1)"/>

  <!-- Hand Holding Phone (Back Sleeve & Forearm) -->
  <path d="M190 280 L195 240 L240 250 L235 300 Z" fill="#173B70"/>
  <!-- Cuff -->
  <rect x="185" y="280" width="58" height="8" rx="3" fill="#3B82F6"/>

  <!-- Smartphone Body Frame -->
  <rect x="135" y="28" width="130" height="236" rx="22" fill="#1E293B"/>
  <rect x="138" y="31" width="124" height="230" rx="19" fill="#0F172A"/>

  <!-- Smartphone Screen Surface -->
  <rect x="141" y="34" width="118" height="224" rx="16" fill="url(#glassGrad1)"/>

  <!-- Speaker / Notch -->
  <rect x="180" y="39" width="40" height="4" rx="2" fill="#334155"/>

  <!-- Screen Content: Status Bar -->
  <text x="148" y="50" font-family="'Poppins', sans-serif" font-size="7" font-weight="600" fill="#64748B">09:41</text>
  <circle cx="242" cy="48" r="2" fill="#64748B"/>
  <rect x="247" y="46" width="6" height="4" rx="1" fill="#64748B"/>

  <!-- App Header on Screen -->
  <rect x="141" y="56" width="118" height="24" fill="#173B70"/>
  <!-- Mini Logo Mark -->
  <circle cx="152" cy="68" r="5" fill="#D94350"/>
  <path d="M150 68 L152 70 L155 66" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  <text x="162" y="71" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="800" fill="#FFFFFF">TanggapTerang</text>

  <!-- Form Page Title on Mobile Screen -->
  <text x="148" y="93" font-family="'Poppins', sans-serif" font-size="8" font-weight="800" fill="#1E293B">Formulir Laporan</text>
  <text x="148" y="102" font-family="'Poppins', sans-serif" font-size="6.5" font-weight="500" fill="#64748B">Sampaikan kejadian di sekitar Anda</text>

  <!-- Step Indicator Bar -->
  <rect x="148" y="110" width="104" height="3" rx="1.5" fill="#E2E8F0"/>
  <rect x="148" y="110" width="35" height="3" rx="1.5" fill="#173B70"/>

  <!-- Field 1: Jenis Bencana -->
  <rect x="148" y="119" width="104" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
  <rect x="153" y="123" width="14" height="14" rx="3" fill="#EFF6FF"/>
  <path d="M157 132 C158 128 162 128 163 132" stroke="#2563EB" stroke-width="1.2" fill="none"/>
  <circle cx="160" cy="127" r="1.5" fill="#2563EB"/>
  <text x="172" y="129" font-family="'Poppins', sans-serif" font-size="6" font-weight="500" fill="#94A3B8">Jenis Bencana</text>
  <text x="172" y="137" font-family="'Poppins', sans-serif" font-size="6.5" font-weight="700" fill="#1E293B">Banjir Luapan</text>

  <!-- Field 2: Lokasi Kejadian -->
  <rect x="148" y="146" width="104" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
  <rect x="153" y="150" width="14" height="14" rx="3" fill="#FEF2F2"/>
  <circle cx="160" cy="156" r="2.5" fill="#D94350"/>
  <path d="M160 158.5 L160 162" stroke="#D94350" stroke-width="1"/>
  <text x="172" y="156" font-family="'Poppins', sans-serif" font-size="6" font-weight="500" fill="#94A3B8">Lokasi Anda</text>
  <text x="172" y="164" font-family="'Poppins', sans-serif" font-size="6.5" font-weight="700" fill="#1E293B">Pilih Wilayah Terdata</text>

  <!-- Field 3: Deskripsi Singkat -->
  <rect x="148" y="173" width="104" height="20" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
  <rect x="153" y="178" width="50" height="3" rx="1.5" fill="#94A3B8"/>
  <rect x="153" y="184" width="75" height="3" rx="1.5" fill="#E2E8F0"/>

  <!-- CTA Button on Mobile Screen -->
  <rect x="148" y="202" width="104" height="18" rx="5" fill="url(#brandGrad1)"/>
  <text x="200" y="214" font-family="'Poppins', sans-serif" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">Buka Formulir Lapor</text>

  <!-- Screen Bottom Nav Line -->
  <rect x="180" y="250" width="40" height="2.5" rx="1.25" fill="#94A3B8"/>

  <!-- Human Hand Holding Phone (Foreground Fingers) -->
  <!-- Thumb on Left Side -->
  <path d="M125 155 C122 145 130 140 137 142 L137 175 C130 176 126 165 125 155 Z" fill="#FBCFE8" stroke="#F472B6" stroke-width="0.5"/>
  <path d="M125 155 C122 145 130 140 137 142 L137 175 C130 176 126 165 125 155 Z" fill="#F5D0C5"/>

  <!-- Hand Fingers Curled on Right Side -->
  <path d="M263 125 C270 125 273 131 270 138 C267 141 264 141 263 140 Z" fill="#E8B4A2"/>
  <path d="M263 145 C271 145 274 151 271 158 C268 161 264 161 263 160 Z" fill="#F5D0C5"/>
  <path d="M263 165 C271 165 274 171 271 178 C268 181 264 181 263 180 Z" fill="#E8B4A2"/>
  <path d="M263 185 C270 185 273 191 270 197 C267 200 264 200 263 199 Z" fill="#F5D0C5"/>

  <!-- Palm & Base Support -->
  <path d="M205 240 C225 245 255 240 260 215 C264 195 264 180 263 170" fill="none" stroke="#E8B4A2" stroke-width="12" stroke-linecap="round"/>

  <!-- Pointer / Tap Ring Graphic on CTA Button -->
  <circle cx="230" cy="211" r="8" fill="#D94350" opacity="0.2"/>
  <circle cx="230" cy="211" r="4" fill="#D94350"/>
</svg>
