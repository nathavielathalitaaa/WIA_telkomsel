<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad5" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>

    <!-- Success Circle Gradient -->
    <linearGradient id="successGrad5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Ticket Box Gradient -->
    <linearGradient id="ticketGrad5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>

    <!-- Soft Shadow -->
    <filter id="shadow5" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#065F46" flood-opacity="0.12"/>
    </filter>
    <filter id="cardShadow5" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#173B70" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Circle -->
  <circle cx="200" cy="150" r="125" fill="url(#bgGrad5)"/>

  <!-- Subtle Festive Confetti Accents (Blue, Yellow, Red, Green) -->
  <circle cx="90" cy="80" r="4" fill="#3B82F6" opacity="0.6"/>
  <rect x="75" y="110" width="6" height="6" rx="1.5" fill="#F59E0B" transform="rotate(25 75 110)" opacity="0.7"/>
  <circle cx="105" cy="180" r="3.5" fill="#10B981" opacity="0.5"/>
  <rect x="85" y="220" width="8" height="4" rx="1" fill="#D94350" transform="rotate(-15 85 220)" opacity="0.6"/>

  <circle cx="310" cy="70" r="3" fill="#D94350" opacity="0.6"/>
  <rect x="325" y="100" width="7" height="7" rx="1.5" fill="#3B82F6" transform="rotate(35 325 100)" opacity="0.7"/>
  <circle cx="300" cy="190" r="4.5" fill="#F59E0B" opacity="0.6"/>
  <rect x="315" y="225" width="8" height="5" rx="1" fill="#10B981" transform="rotate(-30 315 225)" opacity="0.7"/>

  <!-- Top Right Floating Transmission Cloud Badge -->
  <g filter="url(#cardShadow5)" transform="translate(245, 30)">
    <rect width="118" height="34" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <!-- Send Arrow / Plane Icon -->
    <circle cx="18" cy="17" r="7" fill="#EFF6FF"/>
    <path d="M14 17 L21 13 L18 20 L16.5 17.5 L14 17 Z" fill="#2563EB"/>
    <text x="32" y="15" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="700" fill="#173B70">DATA TERKIRIM</text>
    <text x="32" y="25" font-family="'Poppins', sans-serif" font-size="6.5" font-weight="500" fill="#059669">Masuk antrean verifikasi</text>
  </g>

  <!-- Bottom Left Floating Privacy Lock Badge -->
  <g filter="url(#cardShadow5)" transform="translate(40, 205)">
    <rect width="116" height="34" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <!-- Lock Icon -->
    <circle cx="18" cy="17" r="7" fill="#F0FDF4"/>
    <rect x="14" y="16" width="8" height="6" rx="1" fill="#059669"/>
    <path d="M15.5 16 L15.5 14 C15.5 12.6 16.5 12.6 18 12.6 C19.5 12.6 20.5 12.6 20.5 14 L20.5 16" stroke="#059669" stroke-width="1" fill="none"/>
    <text x="32" y="15" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="700" fill="#065F46">PRIVASI AMAN</text>
    <text x="32" y="25" font-family="'Poppins', sans-serif" font-size="6.5" font-weight="500" fill="#64748B">Kontak tidak disebar</text>
  </g>

  <!-- Smartphone Shadow -->
  <rect x="135" y="22" width="130" height="252" rx="24" fill="#065F46" opacity="0.10" filter="url(#shadow5)"/>

  <!-- Smartphone Frame -->
  <rect x="135" y="18" width="130" height="252" rx="22" fill="#1E293B"/>
  <rect x="138" y="21" width="124" height="246" rx="19" fill="#0F172A"/>

  <!-- Smartphone Screen Surface -->
  <rect x="141" y="24" width="118" height="240" rx="16" fill="#FFFFFF"/>

  <!-- Phone Notch -->
  <rect x="180" y="28" width="40" height="4" rx="2" fill="#334155"/>

  <!-- Phone Status Bar -->
  <text x="148" y="38" font-family="'Poppins', sans-serif" font-size="6.5" font-weight="600" fill="#64748B">09:42</text>
  <circle cx="242" cy="36" r="2" fill="#64748B"/>
  <rect x="247" y="34" width="6" height="4" rx="1" fill="#64748B"/>

  <!-- SCREEN CONTENT: SUCCESS STATE -->
  <!-- Big Success Checkmark Circle -->
  <circle cx="200" cy="74" r="22" fill="url(#successGrad5)" filter="url(#cardShadow5)"/>
  <circle cx="200" cy="74" r="26" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>
  <path d="M191 74 L197 80 L209 68" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Success Headline -->
  <text x="200" y="112" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="800" fill="#1E293B" text-anchor="middle">Laporan Terkirim!</text>
  <text x="200" y="122" font-family="'Poppins', sans-serif" font-size="6.5" font-weight="500" fill="#64748B" text-anchor="middle">Informasi diteruskan ke tim verifikasi</text>

  <!-- Ticket Box (Central Highlight) -->
  <g transform="translate(148, 132)">
    <rect width="104" height="66" rx="6" fill="url(#ticketGrad5)" stroke="#93C5FD" stroke-width="1.2"/>
    <!-- Ticket Cutout Notches on Left and Right -->
    <circle cx="0" cy="33" r="4" fill="#FFFFFF"/>
    <circle cx="104" cy="33" r="4" fill="#FFFFFF"/>

    <!-- Ticket Label -->
    <text x="52" y="13" font-family="'Poppins', sans-serif" font-size="6" font-weight="700" fill="#173B70" text-anchor="middle">NOMOR TIKET PELACAKAN</text>

    <!-- Ticket Code Highlight -->
    <rect x="10" y="18" width="84" height="22" rx="4" fill="#173B70"/>
    <text x="52" y="32.5" font-family="'Poppins', monospace" font-size="8.5" font-weight="800" fill="#FDE047" text-anchor="middle" letter-spacing="0.5">RPT-2026-X8K9</text>

    <!-- Copy / Tracking Note -->
    <text x="52" y="52" font-family="'Poppins', sans-serif" font-size="5.5" font-weight="600" fill="#64748B" text-anchor="middle">Simpan nomor ini untuk lacak</text>
    <line x1="20" y1="58" x2="84" y2="58" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="2 2"/>
  </g>

  <!-- Action Button 1: "Lacak Laporan Sekarang" -->
  <rect x="148" y="206" width="104" height="18" rx="5" fill="#173B70"/>
  <text x="200" y="218" font-family="'Poppins', sans-serif" font-size="6.8" font-weight="700" fill="#FFFFFF" text-anchor="middle">Lacak Status Laporan</text>

  <!-- Action Button 2: "Kembali ke Beranda" -->
  <rect x="148" y="228" width="104" height="16" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
  <text x="200" y="239" font-family="'Poppins', sans-serif" font-size="6.5" font-weight="600" fill="#64748B" text-anchor="middle">Selesai</text>

  <!-- Home Indicator Bar -->
  <rect x="180" y="256" width="40" height="2.5" rx="1.25" fill="#94A3B8"/>
</svg>
